<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>EGGY FPS — 蛋宝格斗</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #05070a;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100%; height: 100%; }

  #hud {
    position: fixed; inset: 0; pointer-events: none;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: #e8eef2; user-select: none;
  }
  .tag {
    position: absolute; top: 16px; left: 16px;
    padding: 7px 14px; border-radius: 999px;
    background: rgba(8, 12, 16, 0.55); border: 1px solid rgba(180, 205, 220, 0.18);
    backdrop-filter: blur(8px);
    font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
    color: #9fb4c2;
  }
  .tag b { color: #d9a441; font-weight: 700; }

  /* 调灵敏度时的浮字，过一会儿自己淡出 */
  #sens {
    position: absolute; left: 50%; bottom: 24%; transform: translateX(-50%);
    padding: 8px 20px; border-radius: 999px; white-space: nowrap;
    background: rgba(8, 12, 16, 0.62); border: 1px solid rgba(180, 205, 220, 0.22);
    font-size: 14px; letter-spacing: 0.08em; color: #dceaf4;
    opacity: 0; transition: opacity 0.18s ease;
  }
  #sens.show { opacity: 1; }

  /* 静音键。手机上比键盘更需要它，所以放在 HUD 里而不是只做个 M 快捷键 */
  #mute {
    position: absolute; top: 12px; right: 16px;
    width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-content: center; cursor: pointer;
    background: rgba(10, 16, 22, 0.46); border: 1px solid rgba(150, 195, 225, 0.38);
    color: #d6ecfa; font-size: 15px; line-height: 1;
    pointer-events: auto; backdrop-filter: blur(6px);
    -webkit-tap-highlight-color: transparent;
  }
  #mute.off { color: #6d7a86; border-color: rgba(150, 195, 225, 0.18); }

  #stats {
    position: absolute; top: 56px; right: 16px; text-align: right;
    font-size: 11px; line-height: 1.7; color: #8ea3b2;
    font-variant-numeric: tabular-nums;
    background: rgba(8, 12, 16, 0.55); border: 1px solid rgba(180, 205, 220, 0.14);
    border-radius: 10px; padding: 8px 12px; backdrop-filter: blur(8px);
  }
  #stats span { color: #d9e6ef; }

  #lock {
    position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%);
    font-size: 12px; letter-spacing: 0.06em; color: #7d919f;
    background: rgba(8, 12, 16, 0.5); border: 1px solid rgba(180, 205, 220, 0.14);
    border-radius: 999px; padding: 8px 18px; backdrop-filter: blur(8px);
    white-space: nowrap; transition: opacity 0.35s ease;
  }

  /* 准星：四根从中心向外推的短线，--s 是扩散半径，由射击和移动实时改 */
  #cross {
    position: absolute; left: 50%; top: 50%; width: 0; height: 0;
    --s: 9px; transition: opacity 0.15s ease;
  }
  #cross i {
    position: absolute; display: block; background: #eef5f8;
    box-shadow: 0 0 3px rgba(0, 0, 0, 0.9);
  }
  #cross .ct, #cross .cb { width: 2px; height: 8px; left: -1px; }
  #cross .cl, #cross .cr { width: 8px; height: 2px; top: -1px; }
  #cross .ct { bottom: var(--s); }
  #cross .cb { top: var(--s); }
  #cross .cl { right: var(--s); }
  #cross .cr { left: var(--s); }
  #cross::after {
    content: ''; position: absolute; width: 2px; height: 2px; left: -1px; top: -1px;
    background: rgba(238, 245, 248, 0.55);
  }

  /* 气槽：满槽时描边亮起并呼吸，超必杀可用与否一眼能看出来 */
  #gauge {
    position: absolute; left: 34px; bottom: 30px;
    width: 260px; height: 12px; border-radius: 999px;
    background: rgba(8, 12, 16, 0.6);
    border: 1px solid rgba(120, 175, 220, 0.28);
    overflow: hidden; backdrop-filter: blur(8px);
    transition: box-shadow 0.25s ease, border-color 0.25s ease;
  }
  #gauge i {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, #1f6fd0, #4fb4ff 70%, #cdeaff);
    box-shadow: 0 0 12px rgba(79, 180, 255, 0.65);
    transition: width 0.12s linear;
  }
  #gauge.full {
    border-color: rgba(255, 226, 150, 0.8);
    box-shadow: 0 0 22px rgba(255, 200, 90, 0.5);
    animation: ki 1.1s ease-in-out infinite;
  }
  #gauge.full i { background: linear-gradient(90deg, #e0952c, #ffd166 65%, #fff6dc); }
  @keyframes ki { 50% { box-shadow: 0 0 34px rgba(255, 200, 90, 0.85); } }

  #move {
    position: absolute; left: 34px; bottom: 54px;
    font-size: 19px; font-weight: 800; letter-spacing: 0.22em;
    color: #ffe6a8; text-shadow: 0 0 18px rgba(255, 180, 70, 0.7), 0 2px 8px rgba(0, 0, 0, 0.9);
    opacity: 0; transition: opacity 0.18s ease;
  }

  /* 触屏操作层：只在真的摸过屏幕之后才出现，鼠标玩家看不到 */
  #touch { position: absolute; inset: 0; display: none; pointer-events: none; }
  body.touch #touch { display: block; }
  body.touch #lock, body.touch .tag { display: none; }

  #stick {
    position: absolute; left: 26px; bottom: 92px;
    width: 132px; height: 132px; border-radius: 50%;
    background: rgba(8, 12, 16, 0.34); border: 1px solid rgba(160, 200, 225, 0.30);
    backdrop-filter: blur(6px); pointer-events: auto;
  }
  #stick i {
    position: absolute; left: 50%; top: 50%; width: 56px; height: 56px;
    margin: -28px 0 0 -28px; border-radius: 50%;
    background: rgba(210, 232, 245, 0.5); border: 1px solid rgba(235, 248, 255, 0.7);
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
  }

  #touch b {
    position: absolute; display: grid; place-content: center;
    border-radius: 50%; pointer-events: auto;
    font-size: 14px; font-weight: 700; letter-spacing: 0.06em;
    color: #e6f2fa; background: rgba(10, 16, 22, 0.46);
    border: 1px solid rgba(150, 195, 225, 0.38);
    backdrop-filter: blur(6px); transition: transform 0.06s ease, background 0.06s ease;
  }
  #touch b.on { transform: scale(0.92); background: rgba(90, 165, 225, 0.55); }
  /* 枪是主武器，开火占拇指默认落点、也最大；招式退到上面一圈 */
  #touch b.fi { right: 22px;  bottom: 86px;  width: 104px; height: 104px; font-size: 18px;
                border-color: rgba(255, 150, 110, 0.6); color: #ffd9cb; }
  #touch b.am { right: 146px; bottom: 150px; width: 76px; height: 76px; }
  #touch b.rd { right: 142px; bottom: 58px;  width: 62px; height: 62px; font-size: 12px; }
  #touch b.hd { right: 32px;  bottom: 208px; width: 66px; height: 66px; font-size: 13px;
                border-color: rgba(120, 205, 255, 0.6); }
  #touch b.sr { right: 112px; bottom: 244px; width: 62px; height: 62px; font-size: 13px; }
  #touch b.ts { right: 28px;  bottom: 286px; width: 62px; height: 62px; font-size: 13px; }
  #touch b.sp { right: 104px; bottom: 324px; width: 62px; height: 62px; font-size: 13px;
                color: #ffe6a8; border-color: rgba(255, 205, 120, 0.55); }
  /* 翻滚/冲刺也归右手：左手要一直推摇杆，腾不出手指。
     翻滚要快速点，放在靠近拇指的下沿；冲刺是长按，摞在它上面 */
  #touch b.rl { right: 224px; bottom: 58px;  width: 66px; height: 66px; font-size: 13px; }
  #touch b.sn { right: 232px; bottom: 150px; width: 66px; height: 66px; font-size: 13px; }
  #touch b.nd { right: 300px; bottom: 96px;  width: 66px; height: 66px; font-size: 13px;
                border-color: rgba(150, 230, 175, 0.62); color: #d8f7e2; }
  /* 断点由 main.js 按画面的逻辑尺寸判定后打成 class：
     转屏之后画面的宽高和视口是反的，媒体查询会问错方向 */
  /* 矮屏竖着摞不下四个招式键，压扁整圈 */
  body.short #touch b.hd { bottom: 196px; }
  body.short #touch b.sr { right: 100px; bottom: 226px; }
  /* 压扁那一圈时旋风键会压住瞄准键，往上让一格 */
  body.short #touch b.ts { right: 190px; bottom: 240px; }
  body.short #touch b.sp { right: 254px; bottom: 152px; }
  /* 压扁之后真空键占了冲刺的位子，把冲刺和手雷再往里让 */
  body.short #touch b.sn { right: 330px; bottom: 92px; }
  body.short #touch b.nd { right: 300px; bottom: 20px; }

  /* 手机竖着拿的时候把整块画面转 90° 当横屏用 —— FPS 在竖屏下视野太窄。
     canvas 和虚拟按键都在 body 里，一起转，按键位置不用另算。
     transform 会让子元素的 position:fixed 改成相对 body，正好铺满转后的画面 */
  body.rot {
    position: absolute; top: 0; left: 0;
    width: 100vh; height: 100vw;
    transform-origin: top left;
    transform: rotate(90deg) translateY(-100%);
  }

  /* --- 混战 HUD ------------------------------------------------------ */
  #hp {
    position: absolute; left: 34px; bottom: 50px;
    width: 260px; height: 16px; border-radius: 4px;
    background: rgba(8, 12, 16, 0.62);
    border: 1px solid rgba(220, 120, 110, 0.30);
    overflow: hidden; backdrop-filter: blur(8px);
  }
  #hp i {
    display: block; height: 100%; width: 100%;
    background: linear-gradient(90deg, #c8352a, #f0705c 70%, #ffb9a4);
    box-shadow: 0 0 12px rgba(240, 96, 74, 0.5);
    transition: width 0.14s linear, background 0.3s ease;
  }
  #hp.low i { background: linear-gradient(90deg, #8e1d16, #d63a28); animation: lowhp 0.7s ease-in-out infinite; }
  @keyframes lowhp { 50% { box-shadow: 0 0 26px rgba(255, 60, 40, 0.9); } }
  #hpnum {
    position: absolute; left: 302px; bottom: 46px;
    font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums;
    color: #ffd5cb; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
  }

  /* 手雷存量：弹药数字上面一行，空的那格暗着，一眼看出还剩几颗 */
  #nade {
    position: absolute; right: 34px; bottom: 108px;
    display: flex; gap: 6px; justify-content: flex-end; align-items: center;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95);
  }
  #nade span {
    font-size: 11px; letter-spacing: 0.18em; color: #7f929f; margin-right: 4px;
  }
  #nade i {
    display: block; width: 13px; height: 18px; border-radius: 7px 7px 6px 6px;
    background: #9fe6b0; box-shadow: 0 0 10px rgba(120, 230, 150, 0.45);
  }
  #nade i.spent { background: rgba(150, 175, 190, 0.22); box-shadow: none; }

  #ammo {
    position: absolute; right: 34px; bottom: 34px; text-align: right;
    font-variant-numeric: tabular-nums; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95);
  }
  #ammo b { font-size: 44px; font-weight: 800; color: #f2f7fa; line-height: 1; }
  #ammo s { font-size: 20px; font-weight: 600; color: #7f929f; text-decoration: none; }
  #ammo.dry b { color: #ff6a55; }
  #ammo em {
    display: block; font-style: normal; font-size: 12px; letter-spacing: 0.2em;
    color: #d9a441; margin-top: 4px; opacity: 0; transition: opacity 0.15s ease;
  }
  #ammo.reloading em { opacity: 1; }

  /* 技能冷却：四个格子，冷却时从下往上退回来 */
  #skills { position: absolute; left: 34px; bottom: 84px; display: flex; gap: 7px; }
  #skills div {
    position: relative; width: 60px; height: 30px; border-radius: 5px; overflow: hidden;
    background: rgba(8, 12, 16, 0.6); border: 1px solid rgba(150, 195, 225, 0.28);
    display: grid; place-content: center; backdrop-filter: blur(8px);
    font-size: 12px; font-weight: 700; color: #cfe2ef;
  }
  #skills div i {
    position: absolute; left: 0; right: 0; bottom: 0; height: 0;
    background: rgba(4, 8, 12, 0.78); transition: height 0.08s linear;
  }
  #skills div.ready { border-color: rgba(120, 205, 255, 0.6); color: #eaf6ff; }
  #skills div u {
    position: absolute; left: 4px; top: 2px; font-size: 9px; color: #7f929f;
    text-decoration: none; letter-spacing: 0.08em;
  }

  #feed {
    position: absolute; right: 20px; top: 136px; text-align: right;
    font-size: 13px; line-height: 1.9; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
  }
  #feed div { color: #b6c6d2; }
  #feed div.you { color: #ffe6a8; font-weight: 700; }
  #feed span { color: #f2f7fa; font-weight: 700; }
  #feed em { font-style: normal; color: #ff8a6a; }

  #board {
    position: absolute; left: 16px; top: 56px;
    font-size: 12px; line-height: 1.85; font-variant-numeric: tabular-nums;
    background: rgba(8, 12, 16, 0.5); border: 1px solid rgba(180, 205, 220, 0.14);
    border-radius: 10px; padding: 8px 12px; backdrop-filter: blur(8px);
    color: #93a7b5; min-width: 148px;
  }
  #board div { display: flex; justify-content: space-between; gap: 16px; }
  #board div.me { color: #ffe6a8; font-weight: 700; }
  #board b { color: #e6f0f7; font-weight: 700; }

  /* 受击闪红 + 击杀提示，两个全屏遮罩 */
  #vig {
    position: absolute; inset: 0; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 42%, rgba(190, 20, 10, 0.75) 100%);
  }
  #hitmark {
    position: absolute; left: 50%; top: 50%; width: 0; height: 0; opacity: 0;
  }
  #hitmark i {
    position: absolute; width: 12px; height: 2px; background: #fff;
    box-shadow: 0 0 4px rgba(0, 0, 0, 0.9);
  }
  #hitmark i:nth-child(1) { transform: rotate(45deg)  translate(9px, 0); }
  #hitmark i:nth-child(2) { transform: rotate(135deg) translate(9px, 0); }
  #hitmark i:nth-child(3) { transform: rotate(225deg) translate(9px, 0); }
  #hitmark i:nth-child(4) { transform: rotate(315deg) translate(9px, 0); }
  #hitmark.head i { background: #ff5b4a; }

  #dead {
    position: absolute; inset: 0; display: grid; place-content: center; gap: 10px;
    justify-items: center; background: rgba(60, 8, 4, 0.34); opacity: 0;
    transition: opacity 0.25s ease; pointer-events: none;
  }
  #dead.on { opacity: 1; }
  #dead h2 { font-size: 30px; font-weight: 800; letter-spacing: 0.2em; color: #ff8a6a; }
  #dead p { font-size: 13px; letter-spacing: 0.2em; color: #c8b0aa; }

  #loading {
    position: fixed; inset: 0; display: grid; place-content: center; gap: 18px;
    justify-items: center; background: #05070a; z-index: 10;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    transition: opacity 0.7s ease;
  }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading h1 {
    font-size: 34px; font-weight: 800; letter-spacing: 0.16em; color: #d9a441;
  }
  #loading p { font-size: 12px; letter-spacing: 0.28em; color: #55656f; text-transform: uppercase; }
</style>
  <script type="module" crossorigin src="./assets/index-ylM8Zuqw.js"></script>
</head>
<body>
  <div id="hud">
    <div class="tag">EGGY <b>FPS</b> — 蛋宝格斗</div>
    <div id="mute" title="静音 (M)">🔊</div>
    <div id="sens"></div>
    <div id="stats"></div>
    <div id="cross"><i class="ct"></i><i class="cb"></i><i class="cl"></i><i class="cr"></i></div>
    <div id="move"></div>
    <div id="gauge"><i></i></div>

    <div id="vig"></div>
    <div id="hitmark"><i></i><i></i><i></i><i></i></div>
    <div id="hp"><i></i></div>
    <div id="hpnum">100</div>
    <div id="nade"><span>手雷</span></div>
    <div id="ammo"><b>30</b><s>/210</s><em>换弹中…</em></div>
    <div id="skills">
      <div><u>E</u>波动<i></i></div>
      <div><u>C</u>升龙<i></i></div>
      <div><u>Q</u>旋风<i></i></div>
      <div><u>F</u>真空<i></i></div>
    </div>
    <div id="feed"></div>
    <div id="board"></div>
    <div id="dead"><h2>被击倒</h2><p id="deadinfo"></p></div>

    <div id="lock">点击锁定鼠标 &nbsp;·&nbsp; WASD 移动 &nbsp;·&nbsp; 左键 开枪 &nbsp;·&nbsp; 右键 手雷 &nbsp;·&nbsp; 中键 瞄准 &nbsp;·&nbsp; R 换弹 &nbsp;·&nbsp; E 波动拳 &nbsp;·&nbsp; C 升龙拳 &nbsp;·&nbsp; Q 龙卷旋风脚 &nbsp;·&nbsp; F 真空波动拳（气满）&nbsp;·&nbsp; Shift 冲刺 &nbsp;·&nbsp; 空格 掩体 / 翻滚 &nbsp;·&nbsp; M 静音 &nbsp;·&nbsp; [ ] 调鼠标灵敏度</div>

    <div id="touch">
      <div id="stick"><i></i></div>
      <b class="fi" data-btn="fire">开火</b>
      <b class="am" data-btn="aim">瞄准</b>
      <b class="nd" data-key="Nade">手雷</b>
      <b class="rd" data-key="KeyR">换弹</b>
      <b class="hd" data-key="KeyE">波动</b>
      <b class="sr" data-key="KeyC">升龙</b>
      <b class="ts" data-key="KeyQ">旋风</b>
      <b class="sp" data-key="KeyF">真空</b>
      <b class="rl" data-key="Space">翻滚</b>
      <b class="sn" data-hold="ShiftLeft">冲刺</b>
    </div>
  </div>

  <div id="loading">
    <h1>EGGY</h1>
    <p>Building Scene</p>
  </div>

</body>
</html>
